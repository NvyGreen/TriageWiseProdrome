[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Fail the run if branch coverage of `app` drops below 85%. Because this measures
# coverage over whatever ran, a PARTIAL run (e.g. one file) will trip it — run the
# full suite, or pass `--no-cov` when intentionally running a subset.
addopts = --cov=app --cov-branch --cov-fail-under=85
